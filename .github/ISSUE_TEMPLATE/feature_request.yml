name: 기능 제안 (Feature request)
description: 새 기능이나 개선을 제안해 주세요.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 해결하고 싶나요?
      description: 지금 불편한 점이나 할 수 없는 일을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 생각해 본 다른 방법 (선택)
  - type: markdown
    attributes:
      value: |
        참고: 이 프로젝트는 XAMPP + 순수 HTML/JS/PHP 로 동작하며 Composer, 프레임워크, DB, 외부 CDN 을 쓰지 않습니다 (CONTRIBUTING.md).
